# Controllers configuration for UR5 + Robotiq 85 in gz-sim
# Based on ur_simulation_gz/config/ur_controllers.yaml (official)
# Joint names match the official ur_description (same as real UR5)

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController


speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Servo streams single-point trajectories with nonzero velocities;
    # Jazzy JTC rejects those by default.
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      # trajectory (path) tolerance disabled: MoveIt Servo streams an
      # open-loop position reference; any transient lag > tol would make
      # the JTC abort and hold ("state tolerance violation").
      shoulder_pan_joint: { trajectory: 0.0, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.0, goal: 0.1 }
      elbow_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.0, goal: 0.1 }

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.0, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.0, goal: 0.1 }
      elbow_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.0, goal: 0.1 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: position
