# Desired cable shape for the shaping experiment (plan step 8).
#
# The target is expressed in MODAL coordinates q*, not in marker positions:
# the controller regulates the reduced state x = [q1 q2 q1' q2']', so a target
# given in the same basis needs no conversion and cannot drift from the model.
#
# q* is only meaningful once cable_modal_basis.yaml exists, because the basis
# defines what q1 and q2 mean. Until the identification pipeline has been run,
# [0, 0] is the mean shape of the excitation dataset, i.e. "return the cable to
# its nominal resting shape" — a valid and safe first closed-loop target.
#
# After running build_modal_basis, pick a target by projecting a measured or
# desired marker shape onto the basis rather than by inventing numbers here.
cable_target:
  frame: cable_fixture_frame
  modal_coordinates: [0.0, 0.0]

  # The supervisor declares SHAPE settled below this error and, after holding
  # it, moves to HOLD. Keep it above the marker noise (2 mm) or the state
  # machine will chatter between SHAPE and HOLD.
  shape_tolerance_m: 0.005
  hold_time_s: 2.0
