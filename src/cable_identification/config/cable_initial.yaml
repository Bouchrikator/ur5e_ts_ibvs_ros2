# Cable parameters for the SOFA Cosserat model (SI units) — planar table
# shaping setup: one end clamped at cable_fixture_frame, the other latched to
# the gripper. Synthetic placeholders, NOT measured real-cable values.
cable:
  length_m: 0.7
  radius_m: 0.004
  mass_kg: 0.07
  EI_Nm2: 0.01          # bending rigidity (reduced model: same about y and z)
  GJ_Nm2: 0.008         # torsional rigidity (Cosserat data field name: GI)
  EA_N: 5000.0          # axial rigidity (finite: the rod is extensible)
  GA_N: 2000.0          # shear rigidity
  rayleigh_mass_per_s: 0.0
  rayleigh_stiffness_s: 0.02
  number_of_sections: 16
  number_of_frames: 40
  timestep_s: 0.01
  # Normalized curvilinear coordinates of the virtual markers
  marker_s_over_l: [0.1, 0.25, 0.4, 0.55, 0.7, 0.85, 1.0]
  # Table shaping: rod rests on the table -> zero effective gravity (planar)
  gravity: [0.0, 0.0, 0.0]
  grasp_tip: true
  attach_distance_m: 0.15  # 3D distance to the free end for the snap (legacy spring grip)
